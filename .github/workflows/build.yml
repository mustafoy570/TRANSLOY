name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Cache Gradle (wrapper distribution + dependencies)
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'app/build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: gradle-

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare and verify APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          cp "$apk" app/build/outputs/apk/debug/transloy-v2.0.0.apk
          ls -lh app/build/outputs/apk/debug/transloy-v2.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transloy-v2.0.0-apk
          path: app/build/outputs/apk/debug/transloy-v2.0.0.apk
          if-no-files-found: error

      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Transloy v2.0.0
          body: |
            Transloy second version. Download `transloy-v2.0.0.apk` below and install it on your Android device.

            This APK is signed with the GitHub Actions debug key. If Android refuses an update because the signing key differs from an earlier installation, uninstall the earlier app first; uninstalling removes its downloaded models and settings.
          files: app/build/outputs/apk/debug/transloy-v2.0.0.apk
          fail_on_unmatched_files: true
          make_latest: true
