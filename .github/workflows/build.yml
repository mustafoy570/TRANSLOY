name: Build debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: /opt/gradle-8.9
          key: gradle-8.9-distribution

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-deps-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: gradle-deps-

      - name: Build debug APK
        run: |
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -sL -o /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle-8.9-bin.zip -d /opt
          fi
          /opt/gradle-8.9/bin/gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dari-screen-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a public release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          status=$(curl --silent --show-error --output release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${api}/releases/tags/${RELEASE_TAG}")
          if [ "${status}" = "200" ]; then
            echo "Release ${RELEASE_TAG} already exists; leaving its assets unchanged."
            exit 0
          fi
          if [ "${status}" != "404" ]; then
            echo "Failed to check release ${RELEASE_TAG} (HTTP ${status})."
            cat release.json
            exit 1
          fi

          release=$(curl --fail --silent --show-error --request POST "${api}/releases" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data "{\"tag_name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"name\":\"Transloy v1.0.0\",\"body\":\"Debug APK for Transloy v1.0.0.\"}")
          release_id=$(printf '%s' "${release}" | jq --exit-status --raw-output '.id')
          apk="app/build/outputs/apk/debug/app-debug.apk"
          curl --fail --silent --show-error --request POST \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=transloy-v1.0.0-debug.apk" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${apk}"
